<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zombiekalypse – Spieltisch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23141714'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%239fd24a' font-family='Arial' font-weight='bold'%3EZ%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0f110f;--bg2:#151815;--panel:#1b1f1b;--panel2:#222722;--line:#2c332c;--line2:#3a433a;
  --ink:#e6e8df;--mute:#9aa292;--acc:#9fd24a;--acc2:#c7ef7a;--blood:#d2463a;--warn:#e8a54b;--blue:#5b9be0;
  --r:10px;--font:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--head:"Impact","Haettenschweiler","Arial Narrow Bold",var(--font);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical;min-height:70px}
input[type=checkbox]{width:auto;accent-color:var(--acc)}
h1,h2,h3{margin:0;font-family:var(--head);font-weight:400;letter-spacing:.03em}
h1{font-size:30px;color:var(--acc)}h2{font-size:22px;color:var(--acc2)}h3{font-size:16px;color:var(--acc);text-transform:uppercase}
a{color:var(--acc)}
.mute{color:var(--mute)}.small{font-size:13px}.warn{color:var(--warn)}.bad{color:var(--blood)}.good{color:var(--acc)}
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:8px;padding:7px 13px;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:#11160b;border-color:var(--acc);font-weight:700}
.btn.pri:hover{background:var(--acc2)}
.btn.danger{border-color:#6b2a25;color:#ff9b90}.btn.danger:hover{background:#3a1714}
.btn.sm{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
/* Kopfzeile */
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:#0b0d0b;position:sticky;top:0;z-index:20}
.brand{background:none;border:0;display:flex;align-items:center;gap:9px;padding:0;font-family:var(--head);font-size:22px;letter-spacing:.06em;color:var(--acc)}
.brand .z{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#11160b;display:grid;place-items:center;font-size:18px}
.top .who{margin-left:auto;font-size:13px}
.top .who button{background:none;border:0;color:var(--acc);text-decoration:underline;padding:0}
main{max-width:1200px;margin:0 auto;padding:18px 16px 40px}
/* Start */
.home{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.item{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.item .t{font-weight:700}.item .s{font-size:13px;color:var(--mute)}
.empty{padding:16px;text-align:center;color:var(--mute);border:1px dashed var(--line2);border-radius:8px}
.hero{margin-bottom:16px;padding:18px;border-radius:var(--r);background:linear-gradient(135deg,#1d2618,#141614 60%);border:1px solid var(--line)}
.hero p{margin:6px 0 0;color:var(--mute);max-width:720px}
/* Editor */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.ed section{margin-bottom:14px}
.ed .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ed .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ed label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.ed label.f>span{font-weight:600}
.attrbox{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.attrbox b{display:block;font-family:var(--head);font-size:16px;letter-spacing:.05em;color:var(--acc)}
.step{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
.step button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2)}
.step .v{font-size:24px;font-weight:700;min-width:28px}
.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.skgrp h3{margin-bottom:6px}
.sk{display:grid;grid-template-columns:minmax(0,1fr) 62px;gap:6px;align-items:center;padding:3px 0;border-bottom:1px solid var(--line)}
.sk .n{font-size:14px}.sk .n small{display:block;color:var(--mute);font-size:11.5px;line-height:1.2}
.sk select{padding:4px 6px}
.sum{position:sticky;top:66px}
.sum .line{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)}
.sum ul{margin:8px 0 0;padding-left:18px;font-size:13px}
.lst{display:flex;flex-direction:column;gap:6px}
.lr{display:grid;gap:6px;align-items:center}
.lr.tr{grid-template-columns:minmax(0,1.4fr) 110px 90px auto auto}
.lr.wp{grid-template-columns:minmax(0,1.4fr) 70px minmax(0,1.6fr) auto}
.lr.cs{grid-template-columns:minmax(0,1.4fr) 110px 70px auto}
.x{border:0;background:none;color:var(--mute);font-size:18px;padding:0 6px}.x:hover{color:var(--blood)}
/* Bogen */
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.sh-head{display:flex;gap:12px;align-items:center}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--head);font-size:22px;color:#11160b;background:var(--c,var(--acc));flex:none}
.sh-head h2{line-height:1.1}.sh-head p{margin:2px 0 0;color:var(--mute);font-size:13px}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.rb{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.rb .l{gap:8px;flex-wrap:wrap;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);display:flex;justify-content:space-between}
.rb .v{font-size:20px;font-weight:700;display:flex;align-items:center;gap:6px}
.rb .v button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);font-size:15px;line-height:1;padding:0}
.bar{height:6px;border-radius:3px;background:#0006;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c)}
.dots{display:flex;gap:4px;flex-wrap:wrap}.dots i{width:14px;height:14px;border-radius:3px;border:2px solid var(--warn)}.dots i.on{background:var(--warn)}
.sh-attrs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sa{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px}
.sa .h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line2);padding-bottom:4px;margin-bottom:4px}
.sa .h b{font-family:var(--head);letter-spacing:.05em;color:var(--acc);font-size:15px}.sa .h span{font-size:20px;font-weight:700}
.sa .s{display:flex;justify-content:space-between;gap:6px;font-size:13px;padding:1px 0}
.sa .s.none{color:var(--mute);opacity:.55}
.sa .s .mk{display:inline-flex;align-items:center;gap:5px}
.sa .s input{margin:0;width:13px;height:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border-radius:20px;padding:3px 10px;font-size:13px;border:1px solid var(--line2);background:var(--bg2)}
.tag.v{border-color:#3e5a20;color:var(--acc2)}.tag.n{border-color:#6b2a25;color:#ff9b90}
table.wt{width:100%;border-collapse:collapse;font-size:13.5px}
table.wt td,table.wt th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.wt th{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase}
.pre{white-space:pre-wrap;font-size:14px}
/* Spieltisch */
.tbl{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.tbl-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tabs{display:flex;gap:4px}
.tabs button{border:1px solid var(--line2);background:var(--panel);padding:7px 14px;border-radius:8px 8px 0 0;border-bottom-color:transparent}
.tabs button.on{background:var(--acc);color:#11160b;font-weight:700;border-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 9px 3px 4px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}
.chip i{width:18px;height:18px;border-radius:50%;background:var(--c);display:inline-block}
.chip.gm{border-color:var(--warn)}
.party{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:12px}
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:66px;max-height:calc(100vh - 80px)}
.roller label.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mute);margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--bg2);padding:6px 2px;font-size:13px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--acc);color:#11160b;font-weight:700}
.seg button.on.st{background:var(--warn)}.seg button.on.kr{background:var(--blood);color:#fff}
.log{overflow:auto;display:flex;flex-direction:column;gap:7px;min-height:120px;flex:1}
.lg{background:var(--bg2);border:1px solid var(--line);border-left:4px solid var(--c,var(--line2));border-radius:8px;padding:7px 9px;font-size:13px}
.lg .who{font-weight:700}.lg .lab{color:var(--mute)}
.lg .res{display:block;font-size:17px;font-weight:700;margin-top:3px}
.lg.crit{border-color:var(--blood);background:#2a1210}
.dice{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.d{width:24px;height:24px;border-radius:5px;display:grid;place-items:center;font-size:12px;font-weight:700;background:#2a302a;color:var(--mute)}
.d.ok{background:#3d5a1d;color:var(--acc2)}.d.ten{background:var(--acc);color:#11160b}.d.one{background:#5a1d18;color:#ffb4aa}
.d.sd{outline:2px solid var(--warn);outline-offset:-2px}
.side .card{padding:12px}
/* Whiteboard */
.wb-wrap{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:0 var(--r) var(--r) var(--r);overflow:hidden}
.wb-tools{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}
.wbt{min-width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);background:var(--bg2);font-size:15px;padding:0 6px}
.wbt.on{background:var(--acc);color:#11160b;border-color:var(--acc)}.wbt:disabled{opacity:.35;cursor:not-allowed}
.wbc{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);background:var(--c);padding:0}
.wbc.on{outline:2px solid #fff;outline-offset:1px}
.wbc.custom{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);position:relative;overflow:hidden}
.wbc.custom input{opacity:0;position:absolute;inset:0;cursor:pointer;padding:0}
.wbw{width:auto;padding:4px 6px;font-size:12px}
.wb-sep{width:1px;height:22px;background:var(--line2);margin:0 4px}
.wb-scroll{overflow:auto;max-height:calc(100vh - 190px);padding:8px}
#wb{display:block;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:8px;min-width:100%;cursor:crosshair}
#wb[data-tool=select]{cursor:default}#wb[data-tool=erase]{cursor:not-allowed}
.wb-bg{fill:#121612}
.wbo .hit{fill:none;stroke:transparent;pointer-events:stroke}.wbo .hit.filled{pointer-events:all;fill:transparent}
.wbo text{pointer-events:all}
#wb[data-tool=select] .wbo{cursor:move}#wb[data-tool=erase] .wbo:hover{opacity:.5}
.wb-text{font-family:var(--font);font-weight:700;user-select:none}
.wb-selbox{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:6 5;pointer-events:none}
.tok.can{cursor:grab}
.tok-name{fill:#f2f4ea;font-weight:700;font-size:15px;paint-order:stroke;stroke:#000a;stroke-width:4px;pointer-events:none}
.tok-ini{fill:#11160b;font-family:var(--head);font-size:30px;pointer-events:none}
#wb-draft{pointer-events:none}
/* Kampf */
.cb{display:flex;flex-direction:column;gap:12px}
.tabs .badge{background:var(--blood);color:#fff;border-radius:10px;padding:0 7px;font-size:11.5px;margin-left:4px}
.tabs .badge.off{background:#0005;color:inherit}
.cbform{display:grid;grid-template-columns:minmax(0,1.4fr) 80px 110px auto auto;gap:8px}
.cbform label.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mute)}
.cbturn{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--panel);border:2px solid var(--line2);border-radius:var(--r);padding:12px 14px}
.cbturn.me{border-color:var(--acc);background:#1b2414}
.cbkeys{display:flex;flex-wrap:wrap;gap:4px}.cbkeys .btn{min-width:38px;padding:7px 0}
.cbl{display:flex;flex-direction:column;gap:6px}
.cbr{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.cbr .pos{width:18px;text-align:center;color:var(--mute);font-weight:700}
.cbr .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.cbr .ini{font-size:24px;font-weight:700;min-width:44px;text-align:right}
.cbr.now{border-color:var(--acc);background:#1b2414}.cbr.now .pos{color:var(--acc)}
.cbr.wait{border-style:dashed}
.cbr.done{opacity:.55}
@media (max-width:760px){.cbform{grid-template-columns:1fr 1fr}.cbr{flex-wrap:wrap}.cbr .ini{min-width:0}}
/* Dialog & Hinweis */
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
#modal.on{display:flex}
#modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:18px;width:min(440px,100%)}
#modal .box p{margin:0 0 12px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--acc);border-radius:8px;padding:9px 14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:110;max-width:calc(100% - 32px)}
#toast.on{opacity:1}
.saved{font-size:12px;color:var(--mute)}
@media (max-width:980px){.tbl{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none}.log{max-height:420px}.ed{grid-template-columns:1fr}.sum{position:static}}
@media (max-width:760px){.home{grid-template-columns:minmax(0,1fr)}.skills{grid-template-columns:1fr}.sh-attrs{grid-template-columns:repeat(2,1fr)}.ed .grid4{grid-template-columns:repeat(2,1fr)}.ed .grid2{grid-template-columns:1fr}
  .lr.tr{grid-template-columns:1fr 1fr}.lr.wp{grid-template-columns:1fr 70px}.lr.cs{grid-template-columns:1fr 1fr}.top .brand span.sub{display:none}}
</style>
</head>
<body>
<header class="top">
  <button class="brand" onclick="go('home')"><span class="z">Z</span><span>ZOMBIEKALYPSE<span class="sub mute" style="font-family:var(--font);font-size:13px;letter-spacing:0"> · Spieltisch</span></span></button>
  <div class="who" id="who"></div>
</header>
<main id="app"><p class="mute">Verbinde …</p></main>
<div id="modal"><div class="box" id="modal-box"></div></div>
<div id="toast" role="status"></div>
<script src="adapter.js"></script>

// Kosten in Fertigkeitspunkten (positiv = kostet, negativ = bringt), Regelstand 24.11.2026 (3.4).
const TRAIT_COST = { vorteil: { klein: 2, gross: 5 }, nachteil: { klein: -2, gross: -5 } };
const WEAPONS = [
  ["Faust / Tritt", 2, "Ausdauerschaden statt LP-Schaden"], ["Martial Arts Angriff", 2, "LP-Schaden"], ["Messer / Jagddolch", 2, "Schnell: −1 Initiativekosten; leicht zu verbergen"],
  ["Stuhlbein / Knüppel", 3, "Improvisiert: zerbricht bei zwei gewürfelten 1en"], ["Baseballschläger (Alu)", 4, "Robust; kann Ziele zurückstoßen"], ["Handaxt", 4, "Kurzer Stiel"],

  ["Revolver (.38 Special)", 4, "Zuverlässig: keine Ladehemmung"], ["Colt 1911 (.45 ACP)", 5, "Stoppwirkung: wirft menschliche Ziele um"], ["Magnum .44", 6, "Laut; −1W auf Folgeschuss"],

const ARMORS = [["Keine / normale Kleidung", 7, 6, "Keine Behinderung"], ["Dicke Winterjacke", 8, 7, "Gut gegen Bisse, kaum gegen Kugeln"], ["Biker-Lederjacke", 8, 7, "Hält Kratzer ab"], ["Eishockey-Ausrüstung", 9, 7, "Ideal gegen Zähne"],

const STATES = [["ruhe", "Ruhe"], ["normal", "Normal"], ["stress", "Stress"], ["krise", "Krise"]];
const COLORS = ["#9fd24a", "#e8a54b", "#5b9be0", "#d2463a", "#a77de0", "#e57fa1", "#5cc0b2", "#d9c25f"];

const hpMax = c => 5 + (+c.attrs.koerper || 0) + (+c.attrs.hirn || 0);
const staMax = c => 5 + (+c.attrs.willen || 0) + (+c.attrs.herz || 0);
const iniBase = c => (+c.attrs.koerper || 0) + (+c.attrs.willen || 0);
const cur = (c, k, max) => (c[k] === null || c[k] === undefined) ? max : c[k];
function newChar() {
  return { name: "", concept: "", age: "", gender: "", build: "", desc: "", attrBudget: 13, skillBudget: 20,
    attrs: { koerper: 1, hirn: 1, herz: 1, willen: 1 }, skills: {}, custom: [],
    traits: [{ name: "", kind: "vorteil", size: "klein", free: true }], weapons: [], armor: { name: ARMORS[0][0], melee: 7, ranged: 6 },
    inventory: "", notes: "", hp: null, sta: null, stress: null, stressMax: 3, lp: 0, color: COLORS[Math.floor(Math.random() * COLORS.length)], createdAt: Date.now() };
}
function allSkills(c) { // [{key, name, attr, v, mark, custom}]
  const out = [];
  for (const [a] of ATTRS) {
    for (const [k, n] of SKILLS[a]) { const s = c.skills?.[k] || {}; out.push({ key: k, name: n, attr: a, v: +s.v || 0, mark: !!s.mark }); }
    (c.custom || []).forEach((s, i) => { if (s.attr === a && s.name) out.push({ key: "c" + i, name: s.name, attr: a, v: +s.v || 0, mark: !!s.mark, custom: i }); });
  }
  return out;
}
function points(c) {
  const attrUsed = ATTRS.reduce((t, [a]) => t + (+c.attrs[a] || 0), 0);
  const sk = allSkills(c);
  const skillUsed = sk.reduce((t, s) => t + s.v, 0);
  const traitCost = (c.traits || []).reduce((t, x) => t + (x.free && x.kind === "vorteil" ? 0 : (TRAIT_COST[x.kind]?.[x.size] || 0)), 0);
  const warn = [];
  for (const [a, n] of ATTRS) { const v = +c.attrs[a]; if (v < 1) warn.push(`${n} muss mindestens 1 sein.`); if (v > 6) warn.push(`${n} über 6 (bei Erstellung maximal 6).`); }
  const fours = sk.filter(s => s.v >= 4), over = sk.filter(s => s.v > 4);
  if (fours.length > 1) warn.push(`Nur eine Fertigkeit darf zu Beginn 4 sein (${fours.map(s => s.name).join(", ")}).`);
  if (over.length) warn.push(`Fertigkeiten über 4: ${over.map(s => s.name).join(", ")}.`);
  if ((c.traits || []).filter(x => x.free).length > 1) warn.push("Nur ein kleiner Vorteil ist kostenlos.");
  if ((c.traits || []).some(x => x.free && (x.kind !== "vorteil" || x.size !== "klein"))) warn.push("Der kostenlose Vorteil muss ein kleiner Vorteil sein.");
  return { attrUsed, skillUsed, traitCost, skillTotal: skillUsed + traitCost, warn };
}

function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 3200); }
function modal(html, onOk) {
  return new Promise(res => {
    const m = $("#modal"), b = $("#modal-box"); b.innerHTML = html; m.classList.add("on");
    const done = v => { m.classList.remove("on"); b.innerHTML = ""; res(v); };
    b.querySelector("[data-ok]")?.addEventListener("click", () => done(onOk ? onOk(b) : true));
    b.querySelector("[data-cancel]")?.addEventListener("click", () => done(null));
    const inp = b.querySelector("input"); if (inp) { inp.focus(); inp.select(); inp.addEventListener("keydown", e => { if (e.key === "Enter") done(onOk ? onOk(b) : true); if (e.key === "Escape") done(null); }); }
  });
}
window.uiPrompt = (msg, val = "") => modal(`<p>${esc(msg)}</p><input value="${esc(val)}"><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-cancel>Abbrechen</button><button class="btn pri" data-ok>OK</button></div>`, b => b.querySelector("input").value);
const uiConfirm = (msg, ok = "OK") => modal(`<p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-cancel>Abbrechen</button><button class="btn pri" data-ok>${esc(ok)}</button></div>`).then(v => !!v);
function writeErr(e) { console.error(e); toast("Speichern fehlgeschlagen: " + (e?.message || e)); }
function setPath(o, path, v) { const k = path.split("."); let t = o; for (let i = 0; i < k.length - 1; i++) { if (typeof t[k[i]] !== "object" || t[k[i]] === null) t[k[i]] = {}; t = t[k[i]]; } t[k[k.length - 1]] = v; }

let DB, UID, MYNAME = "";

async function boot() {
  const api = { db: await claude.use("db"), user: await claude.use("user") };
  DB = api.db; UID = await api.user.id();
  MYNAME = window.__zkName ? window.__zkName() : "";

  unsubHome.push(DB.collection(`chars/${UID}/c`).onSnapshot(s => { S.myChars = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); if (S.view === "home") render(); }, writeErr));
  unsubHome.push(DB.collection("games").onSnapshot(s => { S.games = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); if (S.view === "home") render(); }, writeErr));
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("runde")) openGame(h.get("runde")); else render();
}
async function askName(first) {
  let n = "";
  while (!n) { n = ((await uiPrompt(first ? "Willkommen am Spieltisch! Wie sollen dich die anderen sehen? (Dein Name)" : "Dein Name", MYNAME)) || "").trim(); if (!first && !n) return; }
  MYNAME = n.slice(0, 40); if (window.__zkSetName) await window.__zkSetName(MYNAME);
  renderWho();
  if (S.G?.members?.[UID]) DB.doc(`games/${S.G.id}/members/${UID}`).update({ name: MYNAME }).catch(() => {});
}
function renderWho() { $("#who").innerHTML = `Du spielst als <b>${esc(MYNAME || "?")}</b> · <button onclick="askName(false)">ändern</button>`; }
function go(v) { if (v === "home") { closeGame(); S.edit = null; history.replaceState(null, "", location.pathname); } S.view = v; render(); window.scrollTo(0, 0); }
function render() {
  const app = $("#app");

async function newGame() {
  const name = ((await uiPrompt("Name der Spielrunde", "Tag 1 nach dem Ausbruch")) || "").trim(); if (!name) return;
  const id = "g" + rid();
  try {
    await DB.doc(`games/${id}`).set({ name: name.slice(0, 80), gm: UID, gmName: MYNAME, createdAt: Date.now() });
    await DB.doc(`games/${id}/members/${UID}`).set({ role: "gm", name: MYNAME, color: "#e8a54b", joinedAt: Date.now() });
    openGame(id);
  } catch (e) { writeErr(e); }
}
async function delGame(id) {
  if (!await uiConfirm(`Runde „${S.games[id]?.name}“ mit Whiteboard und Würfelprotokoll für alle löschen? Die Charaktere bleiben erhalten.`, "Löschen")) return;
  for (const sub of ["members", "board", "tokens", "rolls", "combat"]) { const s = await DB.collection(`games/${id}/${sub}`).get(); for (const d of s.docs) if (!(sub === "members" && d.id === UID)) await DB.doc(`games/${id}/${sub}/${d.id}`).delete().catch(() => {}); }
  await DB.doc(`games/${id}/members/${UID}`).delete().catch(() => {});
  await DB.doc(`games/${id}`).delete().catch(writeErr);
}

// ===================== Charaktere: Verwaltung =====================
function viewChar(id) { S.viewId = id; go("view"); }

async function delChar(id) {
  if (!await uiConfirm(`„${S.myChars[id]?.name || "Unbenannt"}“ endgültig löschen?`, "Löschen")) return;

function exportChar(id) {

async function saveEdit() {

async function charRes(owner, id, k, d) {

}
function charMark(owner, id, key, on) {

}

// ===================== Kampf & Initiative =====================
// Zustand in games/<id>/combat/state: {active, round, entries:{eid:{kind, name, color, owner, charOwner, charId, base, ini, passed, wait, surprised, roll, seq}}}
const cbPath = () => `games/${S.G.id}/combat/state`;
const cbEntries = () => Object.entries(S.G.combat?.entries || {}).filter(([, e]) => e).map(([id, e]) => ({ id, ...e }));
function cbSorted(list) { // höchster Wert zuerst; bei Gleichstand Gegner vor Spielenden, dann Reihenfolge des Beitritts
  return list.slice().sort((a, b) => (b.ini ?? -99) - (a.ini ?? -99) || (a.kind === "npc" ? 0 : 1) - (b.kind === "npc" ? 0 : 1) || (a.seq || 0) - (b.seq || 0));
}
function cbOrder() { // aktive Reihenfolge inkl. Abwarten
  const act = cbSorted(cbEntries().filter(e => !e.passed && (e.ini ?? 0) > 0));
  const ids = new Set(act.map(e => e.id));
  const waits = act.filter(e => e.wait && ids.has(e.wait) && e.wait !== e.id);
  let out = act.filter(e => !waits.includes(e));
  for (let guard = 0; waits.length && guard < 50; guard++) {
    for (let i = 0; i < waits.length; i++) { const w = waits[i], at = out.findIndex(x => x.id === w.wait); if (at >= 0) { out.splice(at + 1, 0, w); waits.splice(i, 1); i--; } }
  }
  return out.concat(waits);
}
function cbCanAct(e) { return isGM() || (e.kind === "pc" && e.owner === UID); }
function cbCharFor(e) { return e.kind === "pc" ? S.G.chars[`${e.charOwner}/${e.charId}`] : null; }
function cbRollEntry(e, first) { // neuer Initiativewert: Übertrag + 2W10 + Basis
  const c = cbCharFor(e), base = c ? iniBase(c) : (+e.base || 0);
  const carry = first ? 0 : (e.ini ?? 0);

  if (f.group || n === 1) entries["n_" + rid()] = mk(f.group && n > 1 ? `${name} (×${n})` : name, 0);

function cbAct(id, v) { // v: Zahl 0–10 oder "x"
  const order = cbOrder(), e = order[0];
  if (!e || e.id !== id || !cbCanAct(e)) return;
  const patch = { entries: {} };
  for (const o of cbEntries()) if (o.wait === id) patch.entries[o.id] = { wait: null };
  if (v === "x") patch.entries[id] = { passed: true, wait: null };
  else if (v === 0) {

    patch.entries[id] = { wait: next.id };

    <span class="wb-sep"></span>
    <select class="wbw" title="Strichstärke / Größe" onchange="S.G.width=Number(this.value);wbRestyle()">${[2, 4, 7, 12].map(w => `<option value="${w}" ${G.width === w ? "selected" : ""}>${w}px</option>`).join("")}</select>
    <button class="wbt ${G.fill ? "on" : ""}" title="Formen füllen" onclick="S.G.fill=!S.G.fill;wbRestyle();wbToolbar()">◼</button>
    <span class="wb-sep"></span>
    <button class="wbt" ${s ? "" : "disabled"} title="Auswahl löschen (Entf)" onclick="wbDelete(S.G.sel)">🗑</button>
    <button class="wbt" title="Verkleinern" onclick="wbZoom(-1)">−</button><button class="wbt" title="Vergrößern" onclick="wbZoom(1)">+</button>
    ${isGM() ? `<button class="wbt" title="Alle Zeichnungen löschen" onclick="wbClear()">Fläche leeren</button>` : ""}`;
}
function wbTool(t) { const G = S.G; G.tool = t; if (t !== "select") G.sel = null; wbRender(); }
function wbColor(c) { S.G.color = c; wbRestyle(); wbToolbar(); }
function wbRestyle() {
  const G = S.G; if (!G.sel || !G.board[G.sel]) return;
  const o = G.board[G.sel], patch = { c: G.color, w: G.width };
  if (["rect", "ellipse"].includes(o.t)) patch.f = G.fill;
  wbUpdate(G.sel, patch);
}
function wbZoom(d) { const G = S.G; G.zoom = Math.max(.6, Math.min(2.5, +(G.zoom + d * .2).toFixed(1))); const svg = $("#wb"); if (svg) svg.style.width = G.zoom * 100 + "%"; }
function wbShape(o, id) {
  const c = o.c || "#9fd24a", w = o.w || 4, fill = o.f ? c : "none", fo = o.f ? .35 : 1;
  const tr = `transform="translate(${+o.ox || 0} ${+o.oy || 0})"`;
  let vis = "", hit = "";
  if (o.t === "path" && o.p?.length) {
    const d = "M" + o.p.map(q => (+q[0]) + " " + (+q[1])).join(" L");
    vis = `<path d="${d}" fill="none" stroke="${esc(c)}" stroke-width="${+w}" stroke-linecap="round" stroke-linejoin="round"/>`;
    hit = `<path d="${d}" class="hit" stroke-width="${+w + 16}"/>`;
  } else if (o.t === "line" || o.t === "arrow") {
    vis = `<line x1="${+o.x1}" y1="${+o.y1}" x2="${+o.x2}" y2="${+o.y2}" stroke="${esc(c)}" stroke-width="${+w}" stroke-linecap="round"/>`;
    if (o.t === "arrow") {
      const a = Math.atan2(o.y2 - o.y1, o.x2 - o.x1), L = 14 + w * 2.2;
      const p1 = [o.x2 - L * Math.cos(a - .45), o.y2 - L * Math.sin(a - .45)], p2 = [o.x2 - L * Math.cos(a + .45), o.y2 - L * Math.sin(a + .45)];
      vis += `<polygon points="${+o.x2},${+o.y2} ${p1.join(",")} ${p2.join(",")}" fill="${esc(c)}"/>`;
    }
    hit = `<line x1="${+o.x1}" y1="${+o.y1}" x2="${+o.x2}" y2="${+o.y2}" class="hit" stroke-width="${+w + 16}"/>`;
  } else if (o.t === "rect" || o.t === "ellipse") {
    const x = Math.min(o.x1, o.x2), y = Math.min(o.y1, o.y2), W = Math.abs(o.x2 - o.x1), H = Math.abs(o.y2 - o.y1);
    const sh = o.t === "rect" ? (cls, sw) => `<rect x="${x}" y="${y}" width="${W}" height="${H}" rx="4" ${cls} stroke-width="${sw}"/>` : (cls, sw) => `<ellipse cx="${x + W / 2}" cy="${y + H / 2}" rx="${W / 2}" ry="${H / 2}" ${cls} stroke-width="${sw}"/>`;
    vis = sh(`fill="${esc(fill)}" fill-opacity="${fo}" stroke="${esc(c)}"`, +w);
    hit = sh(`class="hit ${o.f ? "filled" : ""}"`, +w + 14);
  } else if (o.t === "text") {
    vis = `<text x="${+o.x}" y="${+o.y}" fill="${esc(c)}" font-size="${+o.s || 32}" class="wb-text">${esc(o.text || "")}</text>`;
  } else if (o.t === "stamp") {
    vis = `<text x="${+o.x}" y="${+o.y}" font-size="${+o.s || 48}" text-anchor="middle" dominant-baseline="central" class="wb-text">${esc(o.text || "")}</text>`;
  }
  return `<g class="wbo" data-id="${esc(id)}" ${tr}>${vis}${hit}</g>`;
}
function wbRender() {
  const svg = $("#wb"); if (!svg || !S.G) return;
  const G = S.G; svg.dataset.tool = G.tool;
  const ov = WD?.mode === "move" ? WD : null;
  const objs = Object.entries(G.board).sort((a, b) => (a[1].ts || 0) - (b[1].ts || 0));
  $("#wb-objs").innerHTML = objs.map(([id, o]) => wbShape(ov && ov.id === id ? { ...o, ox: ov.ox, oy: ov.oy } : o, id)).join("");
  const selG = $("#wb-sel"); selG.innerHTML = "";
  if (G.sel && G.board[G.sel]) {
    const g = svg.querySelector(`.wbo[data-id="${G.sel}"]`);
    if (g) { try { const b = g.getBBox(), o = G.board[G.sel], ox = (ov && ov.id === G.sel ? ov.ox : o.ox) || 0, oy = (ov && ov.id === G.sel ? ov.oy : o.oy) || 0;
      selG.innerHTML = `<rect x="${b.x + ox - 8}" y="${b.y + oy - 8}" width="${b.width + 16}" height="${b.height + 16}" class="wb-selbox"/>`; } catch (e) {} }
  }
  const players = Object.entries(G.members).filter(([, m]) => m.charId && G.chars[`${m.charOwner}/${m.charId}`]);
  $("#wb-toks").innerHTML = players.map(([u, m], i) => {
    const c = G.chars[`${m.charOwner}/${m.charId}`];
    const t = (WD?.mode === "tok" && WD.uid === u) ? WD : (G.tokens[u] || { x: 120 + i * 120, y: WB_H - 100 });
    const can = u === UID || isGM(), H = hpMax(c), hp = cur(c, "hp", H), frac = Math.max(0, Math.min(1, hp / H));
    return `<g class="tok ${can ? "can" : ""}" data-tok="${u}" transform="translate(${+t.x} ${+t.y})">
      <circle r="44" fill="rgba(0,0,0,.5)"/><circle r="38" fill="${esc(c.color || "#9fd24a")}"/>
      <text class="tok-ini" text-anchor="middle" dominant-baseline="central">${esc(initials(c.name))}</text>
      <circle r="44" fill="none" stroke="#3a1714" stroke-width="5"/>
      ${frac > 0 ? `<circle r="44" fill="none" stroke="#d2463a" stroke-width="5" stroke-dasharray="${(frac * 276.5).toFixed(1)} 400" transform="rotate(-90)"/>` : ""}
      <text y="64" text-anchor="middle" class="tok-name">${esc(c.name || "?")}</text></g>`;
  }).join("");
  wbToolbar();
}
function wbPt(e) {
  const svg = $("#wb"), pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const q = pt.matrixTransform(svg.getScreenCTM().inverse());
  return [Math.round(Math.max(0, Math.min(WB_W, q.x)) * 10) / 10, Math.round(Math.max(0, Math.min(WB_H, q.y)) * 10) / 10];
}
document.addEventListener("pointerdown", async e => {
  const svg = e.target.closest?.("#wb"); if (!svg || e.button > 0 || !S.G) return;
  const G = S.G, p = wbPt(e);
  if (!myMember()) { toast("Tritt der Runde bei, um mitzuzeichnen."); return; }
  const tok = e.target.closest(".tok");
  if (tok && G.tool === "select") {
    const u = tok.dataset.tok;
    if (u !== UID && !isGM()) { toast("Diese Figur dürfen nur ihr Besitzer und die Spielleitung bewegen."); return; }
    const t = G.tokens[u] || parseTr(tok);
    WD = { mode: "tok", uid: u, sx: p[0], sy: p[1], x0: t.x, y0: t.y, x: t.x, y: t.y };
    svg.setPointerCapture(e.pointerId); e.preventDefault(); return;
  }
  const obj = e.target.closest(".wbo");
  if (G.tool === "erase") { if (obj) wbDelete(obj.dataset.id); return; }
  if (G.tool === "select") {
    if (obj) {
      const id = obj.dataset.id, o = G.board[id];
      G.sel = id; G.color = o.c || G.color; G.width = o.w || G.width; if ("f" in o) G.fill = !!o.f;
      WD = { mode: "move", id, sx: p[0], sy: p[1], ox0: o.ox || 0, oy0: o.oy || 0, ox: o.ox || 0, oy: o.oy || 0 };
      svg.setPointerCapture(e.pointerId); e.preventDefault();
    } else G.sel = null;
    wbRender(); return;
  }
  if (G.tool === "stamp") { wbAdd({ t: "stamp", x: p[0], y: p[1], text: G.stamp, s: 30 + G.width * 5 }); return; }
  if (G.tool === "text") {
    const text = await uiPrompt("Text auf dem Whiteboard"); if (!text) return;
    wbAdd({ t: "text", x: p[0], y: p[1], text: text.slice(0, 200), s: 18 + G.width * 4, c: G.color });
    return;
  }
  WD = { mode: "draw", t: G.tool, p: [p], x1: p[0], y1: p[1], x2: p[0], y2: p[1] };
  svg.setPointerCapture(e.pointerId); e.preventDefault();
});
document.addEventListener("pointermove", e => {
  if (!WD) return;
  const svg = $("#wb"); if (!svg) { WD = null; return; }
  const p = wbPt(e), G = S.G;
  if (WD.mode === "tok") {
    WD.x = WD.x0 + p[0] - WD.sx; WD.y = WD.y0 + p[1] - WD.sy;
    svg.querySelector(`.tok[data-tok="${WD.uid}"]`)?.setAttribute("transform", `translate(${WD.x} ${WD.y})`);
    return;
  }
  if (WD.mode === "move") {
    WD.ox = WD.ox0 + p[0] - WD.sx; WD.oy = WD.oy0 + p[1] - WD.sy;
    svg.querySelector(`.wbo[data-id="${WD.id}"]`)?.setAttribute("transform", `translate(${WD.ox} ${WD.oy})`);
    $("#wb-sel").innerHTML = ""; return;
  }
  if (WD.mode === "draw") {
    if (WD.t === "pen") { const l = WD.p[WD.p.length - 1]; if (Math.hypot(p[0] - l[0], p[1] - l[1]) > 2.5 && WD.p.length < 2500) WD.p.push(p); }
    WD.x2 = p[0]; WD.y2 = p[1];
    const o = WD.t === "pen" ? { t: "path", p: WD.p } : { t: WD.t, x1: WD.x1, y1: WD.y1, x2: WD.x2, y2: WD.y2 };
    $("#wb-draft").innerHTML = wbShape({ ...o, c: G.color, w: G.width, f: G.fill }, "draft");
  }
});
document.addEventListener("pointerup", () => {
  if (!WD) return;
  const d = WD, G = S.G; WD = null; if (!G) return;
  if (d.mode === "tok") {
    const x = Math.round(Math.max(45, Math.min(WB_W - 45, d.x))), y = Math.round(Math.max(45, Math.min(WB_H - 70, d.y)));
    G.tokens[d.uid] = { x, y }; wbRender();
    DB.doc(`games/${G.id}/tokens/${d.uid}`).set({ x, y, by: UID, ts: Date.now() }).catch(writeErr);
    return;
  }
  if (d.mode === "move") {
    if (d.ox !== d.ox0 || d.oy !== d.oy0) wbUpdate(d.id, { ox: Math.round(d.ox), oy: Math.round(d.oy) });
    wbRender(); return;
  }
  if (d.mode === "draw") {
    $("#wb-draft").innerHTML = "";
    if (d.t === "pen") { if (d.p.length < 2) d.p.push([d.p[0][0] + .5, d.p[0][1] + .5]); wbAdd({ t: "path", p: d.p, c: G.color, w: G.width }); }
    else if (Math.hypot(d.x2 - d.x1, d.y2 - d.y1) > 4) wbAdd({ t: d.t, x1: d.x1, y1: d.y1, x2: d.x2, y2: d.y2, c: G.color, w: G.width, f: ["rect", "ellipse"].includes(d.t) ? G.fill : undefined });
  }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Delete" || e.key === "Backspace") && S.G?.sel && S.G.tab === "board" && !e.target.closest("input,textarea,select")) { e.preventDefault(); wbDelete(S.G.sel); }
});
function parseTr(g) { const m = (g.getAttribute("transform") || "").match(/translate\(([-\d.]+)[ ,]+([-\d.]+)/); return m ? { x: +m[1], y: +m[2] } : { x: 0, y: 0 }; }
async function wbAdd(o) {
  const G = S.G; Object.keys(o).forEach(k => o[k] === undefined && delete o[k]);
  o.by = UID; o.ts = Date.now();
  const id = "o" + o.ts.toString(36) + Math.random().toString(36).slice(2, 6);
  G.board[id] = o; wbRender();
  try { await DB.doc(`games/${G.id}/board/${id}`).set(o); } catch (e) { delete G.board[id]; wbRender(); writeErr(e); }
}
const wbPending = {};
async function wbUpdate(id, patch) {
  const G = S.G; if (!G.board[id]) return;
  G.board[id] = { ...G.board[id], ...patch }; wbRender();
  if (wbPending[id]) { wbPending[id].next = { ...(wbPending[id].next || {}), ...patch }; return; }
  wbPending[id] = {}; let p = patch;
  while (p) { try { await DB.doc(`games/${G.id}/board/${id}`).update(p); } catch (e) { if (e?.code !== "invalid_argument") writeErr(e); } p = wbPending[id].next; wbPending[id].next = null; }
  delete wbPending[id];
}
function wbDelete(id) {
  const G = S.G; if (!id || !G.board[id]) return;
  delete G.board[id]; if (G.sel === id) G.sel = null; wbRender();
  DB.doc(`games/${G.id}/board/${id}`).delete().catch(writeErr);
}
async function wbClear() {
  if (!await uiConfirm("Alle Zeichnungen auf dem Whiteboard für alle löschen? Die Charakterfiguren bleiben.", "Leeren")) return;
  const G = S.G, ids = Object.keys(G.board); G.board = {}; G.sel = null; wbRender();
  for (const id of ids) DB.doc(`games/${G.id}/board/${id}`).delete().catch(() => {});
}

window.addEventListener("hashchange", () => { const r = new URLSearchParams(location.hash.slice(1)).get("runde"); if (r && r !== S.G?.id) openGame(r); });
boot().catch(e => { console.error(e); $("#app").innerHTML = `<div class="card bad">Verbindung zum Server fehlgeschlagen: ${esc(e.message || e)}</div>`; });
</script>

# Render Blueprint – legt den Web-Service mit dauerhaftem Speicher an.
services:
  - type: web
    name: zombiekalypse
    runtime: node
    plan: starter            # Persistent Disks gibt es nur auf bezahlten Plänen
    buildCommand: echo "Keine Abhängigkeiten zu installieren"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ACCESS_CODE     # optional: Zugangscode für deine Gruppe (beim Anlegen eintragen oder leer lassen)
        sync: false
    disk:
      name: zombiekalypse-data
      mountPath: /var/data
      sizeGB: 1
